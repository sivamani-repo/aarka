version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aarka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sivamani_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-aarka_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aarka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sivamani_user} -d ${POSTGRES_DB:-aarka_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aarka_pgdata:
    name: aarka_pgdata
